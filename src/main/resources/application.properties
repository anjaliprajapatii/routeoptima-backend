# ==========================================
# 🚀 APPLICATION SETUP
# ==========================================
spring.application.name=RouteOptima
server.port=${PORT:8082}

# ==========================================
# ☁️ RAILWAY CLOUD DATABASE CONNECTION
# ==========================================

# 1. URL (Railway Host: ballast.proxy.rlwy.net | Port: 12355 | DB: railway)
spring.datasource.url=jdbc:mysql://ballast.proxy.rlwy.net:12355/railway?useSSL=false&allowPublicKeyRetrieval=true

# 2. USERNAME (Railway ka default user 'root' hi hota hai)
spring.datasource.username=root

# 3. PASSWORD (Jo aapne Railway se copy kiya tha)
spring.datasource.password=uCXSISdtiMcHrlyVCMthVTSycsWNJzrE

# 4. DRIVER (Standard MySQL Driver)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# ⚙️ HIBERNATE SETTINGS (Tables Auto-Create)
# ==========================================
# 'update' ka matlab hai agar table nahi hai toh ban jayegi, hai toh update hogi. Data delete nahi hoga.
spring.jpa.hibernate.ddl-auto=update

# Console mein SQL queries dikhane ke liye
spring.jpa.show-sql=true

# Database Dialect (Modern MySQL ke liye)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect